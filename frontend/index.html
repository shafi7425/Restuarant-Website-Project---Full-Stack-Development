<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Default SEO tags -->
  <title>Zomo Web</title>
  <meta name="description" content="Default description">
  <meta name="keywords" content="zomo, food, delivery">

  <!-- Stylesheets -->
  <!--Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet">

  <!-- bootstrap css -->
  <link rel="stylesheet" id="rtl-link" type="text/css" href="assets/css/vendors/bootstrap.css">

  <!-- swiper css -->
  <link rel="stylesheet" type="text/css" href="assets/css/vendors/swiper-bundle.min.css">

  <!-- remixicon css -->
  <link rel="stylesheet" type="text/css" href="assets/css/vendors/remixicon.css">

  <!-- Theme css -->
  <link rel="stylesheet" id="change-link" type="text/css" href="assets/css/style.css">
  <style>
    /* ✅ Store Notice Bar */
  .store-notice {
    width: 100%;
    padding: 10px 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  /* ✅ Hide by default */
  .store-notice.hidden {
    transform: translateY(-100%);
    opacity: 0;
  }

  /* ✅ Types */
  .store-notice.info {
    background: linear-gradient(90deg, #0284c7, #0369a1);
  }

  .store-notice.success {
    background: linear-gradient(90deg, #16a34a, #166534);
  }

  .store-notice.warning {
    background: linear-gradient(90deg, #f59e0b, #b45309);
  }

  .store-notice.error {
    background: linear-gradient(90deg, #dc2626, #7f1d1d);
  }

  /* ✅ Text */
  .notice-content {
    flex: 1;
    text-align: center;
  }

  /* ✅ Close button */
  #closeNotice {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    margin-left: 10px;
  }

  </style>
</head>

<body>

  <!-- ✅ Store Announcement Topbar -->
  <div id="storeNoticeBar" class="store-notice hidden">
    <div class="notice-content">
      <span id="noticeText"></span>
    </div>
    <button id="closeNotice">✖</button>
  </div>

  <!-- Header placeholder -->
  <div id="header"></div>

  <!-- Main content placeholder -->
  <main id="app"></main>

  <!-- Footer placeholder -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script type="module" src="src/app.js"></script>
  <!-- bootstrap js -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>

  <!-- footer accordion js -->
  <script src="assets/js/footer-accordion.js"></script>

  <!-- loader js -->
  <script src="assets/js/loader.js"></script>

  <!-- swiper js -->
  <script src="assets/js/swiper-bundle.min.js"></script>
  <script src="assets/js/custom-swiper.js"></script>


  <!-- menu offcanvas js -->
  <script src="assets/js/menu-offcanvas.js"></script>

  <!-- script js -->
  <script src="assets/js/script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
const noticeBar = document.getElementById("storeNoticeBar");
const noticeText = document.getElementById("noticeText");
const closeNotice = document.getElementById("closeNotice");

let notices = [];
let currentIndex = 0;
let interval = null;

// ✅ Fetch Active Notices from Backend
async function loadStoreNotices() {
  try {
    const res = await fetch("http://localhost:5000/api/store-notices");
    notices = await res.json();

    console.log("Loaded notices:", notices);

    if (!notices.length) return;

    showNotice(0);

    // ✅ Auto rotate every 5 seconds
    if (notices.length > 1) {
      interval = setInterval(() => {
        currentIndex = (currentIndex + 1) % notices.length;
        showNotice(currentIndex);
      }, 5000);
    }

  } catch (error) {
    console.error("Failed to load store notices:", error);
  }
}

// ✅ Display Notice
function showNotice(index) {
  const notice = notices[index];

  noticeBar.className = `store-notice ${notice.type}`;
  noticeText.innerHTML = `<strong>${notice.title}</strong> — ${notice.message}`;

  noticeBar.classList.remove("hidden");
}

// ✅ Close button
closeNotice.addEventListener("click", () => {
  noticeBar.classList.add("hidden");
  clearInterval(interval);
});

// ✅ Load on page load
document.addEventListener("DOMContentLoaded", loadStoreNotices);
</script>

</body>

</html>
