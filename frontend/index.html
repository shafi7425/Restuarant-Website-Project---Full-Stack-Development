  <style>
  /* ================================
   ✅ Elegant Announcement Slider
================================ */

.announcement-slider {
    width: 100%;
    background: linear-gradient(135deg, #111, #222);
    position: relative;
    overflow: hidden;
    z-index: 1000;
}

.announcement-inner {
    max-width: 1400px;
    margin: auto;
    position: relative;
    padding: 0 20px;
}

/* Slides wrapper */
#announcementTrack {
    position: relative;
    height: 42px;
}

/* Each slide */
.announcement-slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: #fff;

    opacity: 0;
    transform: translateY(10px);
    filter: blur(2px);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease,
        filter 0.8s ease;
}

.announcement-slide.active {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
}

/* Title Highlight */
.announcement-title {
    font-weight: 700;
    color: #ffb703;
    white-space: nowrap;
}



/* Hide on print */
@media print {
    .announcement-slider {
        display: none;
    }
}


  </style>
</head>

<body>

  <!-- Elegant Announcement Slider -->
  <div id="announcementSlider" class="announcement-slider d-none">
      <div class="announcement-inner">
