<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Default SEO tags -->
  <title>Zomo Web</title>
  <meta name="description" content="Default description">
  <meta name="keywords" content="zomo, food, delivery">

  <!-- Stylesheets -->
  <!--Google font-->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet">

  <!-- bootstrap css -->
  <link rel="stylesheet" id="rtl-link" type="text/css" href="assets/css/vendors/bootstrap.css">

  <!-- swiper css -->
  <link rel="stylesheet" type="text/css" href="assets/css/vendors/swiper-bundle.min.css">

  <!-- remixicon css -->

  <!-- Theme css -->
  <link rel="stylesheet" id="change-link" type="text/css" href="assets/css/style.css">
  <style>
    /* ✅ Store Notice Bar */
  .store-notice {
    width: 100%;
    padding: 10px 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  /* ✅ Hide by default */
  .store-notice.hidden {
    transform: translateY(-100%);
    opacity: 0;
  }

  /* ✅ Types */
  .store-notice.info {
    background: linear-gradient(90deg, #0284c7, #0369a1);
  }

  .store-notice.success {
    background: linear-gradient(90deg, #16a34a, #166534);
  }

  .store-notice.warning {
    background: linear-gradient(90deg, #f59e0b, #b45309);
  }

  .store-notice.error {
    background: linear-gradient(90deg, #dc2626, #7f1d1d);
  }

  /* ✅ Text */
  .notice-content {
    flex: 1;
    text-align: center;
  }

  /* ✅ Close button */
  #closeNotice {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    margin-left: 10px;
  }

  </style>
</head>

<body>

  <!-- ✅ Store Announcement Topbar -->
  <div id="storeNoticeBar" class="store-notice hidden">
    <div class="notice-content">
      <span id="noticeText"></span>
    </div>
    <button id="closeNotice">✖</button>
  </div>

  <!-- Header placeholder -->
  <div id="header"></div>

      <div id="announcementBar" class="container mt-3"></div>


  <!-- Main content placeholder -->
  <main id="app"></main>

  <!-- Footer placeholder -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script type="module" src="src/app.js"></script>
  <!-- bootstrap js -->

  <!-- footer accordion js -->

  <!-- loader js -->

  <!-- swiper js -->

  <script src="assets/js/custom-swiper.js"></script>


  <!-- menu offcanvas js -->

  <!-- script js -->

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>


</body>

</html>
